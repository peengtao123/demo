<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${permission.id != null} ? '编辑权限' : '新建权限'">权限表单</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .form-group {
                margin-bottom: 20px;
            }
            
            label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: bold;
            }
            
            input[type="text"],
            textarea {
                width: 100%;
                padding: 12px;
                border: 1px solid #ddd;
                border-radius: 5px;
                font-size: 14px;
                transition: border-color 0.3s;
            }
            
            input[type="text"]:focus,
            textarea:focus {
                outline: none;
                border-color: #667eea;
            }
            
            textarea {
                resize: vertical;
                min-height: 100px;
            }
            
            .help-text {
                font-size: 12px;
                color: #666;
                margin-top: 5px;
            }
            
            .form-actions {
                display: flex;
                gap: 10px;
                margin-top: 30px;
            }
            
            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
            }
            
            .btn-secondary {
                background: #6c757d;
                color: white;
            }
            
            .btn-secondary:hover {
                background: #5a6268;
            }
        </style>
        
        <form th:action="@{/admin/permissions/save}" th:object="${permission}" method="post">
            <input type="hidden" th:field="*{id}" />
            
            <div class="form-group">
                <label for="name">权限名称 *</label>
                <input type="text" id="name" th:field="*{name}" required 
                       placeholder="例如：查看用户、创建角色" />
            </div>
            
            <div class="form-group">
                <label for="code">权限编码 *</label>
                <input type="text" id="code" th:field="*{code}" required 
                       placeholder="例如：user:view、role:create" />
                <div class="help-text">建议使用格式：模块:操作，如 user:view、role:create</div>
            </div>
            
            <div class="form-group">
                <label for="description">权限描述</label>
                <textarea id="description" th:field="*{description}" 
                          placeholder="请输入权限描述信息"></textarea>
            </div>
            
            <div class="form-group">
                <label for="type">权限类型 *</label>
                <select id="type" th:field="*{type}" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;">
                    <option value="MENU">菜单权限</option>
                    <option value="BUTTON">按钮权限</option>
                    <option value="API">接口权限</option>
                </select>
                <div class="help-text">菜单权限用于控制菜单显示，按钮权限用于控制页面按钮，接口权限用于控制API访问</div>
            </div>
            
            <div class="form-group">
                <label for="icon">图标（仅菜单权限需要）</label>
                <input type="text" id="icon" th:field="*{icon}" 
                       placeholder="例如：👥、🎭、🔐" />
                <div class="help-text">支持Emoji图标或CSS类名</div>
            </div>
            
            <div class="form-group">
                <label for="sortOrder">排序号</label>
                <input type="number" id="sortOrder" th:field="*{sortOrder}" 
                       placeholder="数字越小越靠前" min="0" />
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/admin/permissions" class="btn btn-secondary">取消</a>
            </div>
        </form>
        
        <script>
            // 根据权限类型显示/隐藏图标的提示
            document.getElementById('type').addEventListener('change', function() {
                var iconGroup = document.getElementById('icon').closest('.form-group');
                if (this.value === 'MENU') {
                    iconGroup.style.display = 'block';
                } else {
                    iconGroup.style.display = 'none';
                    document.getElementById('icon').value = '';
                }
            });
            
            // 初始化时检查类型
            window.addEventListener('DOMContentLoaded', function() {
                var typeSelect = document.getElementById('type');
                var iconGroup = document.getElementById('icon').closest('.form-group');
                if (typeSelect.value !== 'MENU') {
                    iconGroup.style.display = 'none';
                }
            });
        </script>
    </div>
</body>
</html>
