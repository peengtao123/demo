<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>权限管理</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .search-box {
                display: flex;
                gap: 10px;
                flex: 1;
                max-width: 500px;
            }
            
            .search-box input {
                flex: 1;
                padding: 10px 15px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .search-box input:focus {
                outline: none;
                border-color: #2196f3;
                box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
            }
            
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                background: white;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }
            
            thead {
                background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
                color: white;
            }
            
            th, td {
                padding: 15px;
                text-align: left;
                border-bottom: 1px solid #eee;
            }
            
            tbody tr:hover {
                background: #e3f2fd;
            }
            
            .badge {
                display: inline-block;
                padding: 5px 12px;
                border-radius: 15px;
                font-size: 12px;
                font-weight: bold;
            }
            
            .badge-status-enabled {
                background: #4caf50;
                color: white;
            }
            
            .badge-status-disabled {
                background: #f44336;
                color: white;
            }
            
            .badge-type-menu {
                background: #9c27b0;
                color: white;
            }
            
            .badge-type-button {
                background: #ff5722;
                color: white;
            }
            
            .badge-type-api {
                background: #00bcd4;
                color: white;
            }
            
            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
                margin-right: 5px;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
            }
            
            .btn-success {
                background: #4caf50;
                color: white;
            }
            
            .btn-success:hover {
                background: #45a049;
            }
            
            .btn-danger {
                background: #f44336;
                color: white;
            }
            
            .btn-danger:hover {
                background: #da190b;
            }
            
            .btn-warning {
                background: #ff9800;
                color: white;
            }
            
            .btn-warning:hover {
                background: #e68900;
            }
            
            .btn-info {
                background: #2196f3;
                color: white;
            }
            
            .btn-info:hover {
                background: #1976d2;
            }
            
            .pagination {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 20px;
                gap: 10px;
            }
            
            .pagination a, .pagination span {
                padding: 8px 16px;
                border: 2px solid #e0e0e0;
                border-radius: 5px;
                text-decoration: none;
                color: #333;
                transition: all 0.3s;
            }
            
            .pagination a:hover {
                background: #2196f3;
                color: white;
                border-color: #2196f3;
            }
            
            .pagination .active {
                background: #2196f3;
                color: white;
                border-color: #2196f3;
            }
            
            .checkbox-cell {
                width: 40px;
            }
            
            .permission-icon {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
                color: white;
            }
            
            .permission-info {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .action-buttons {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
            }
            
            .alert {
                padding: 12px 20px;
                margin-bottom: 20px;
                border-radius: 8px;
                border-left: 4px solid;
            }
            
            .alert-success {
                background: #d4edda;
                border-color: #28a745;
                color: #155724;
            }
            
            .alert-error {
                background: #f8d7da;
                border-color: #dc3545;
                color: #721c24;
            }
            
            .code-badge {
                background: #f5f5f5;
                color: #333;
                padding: 4px 8px;
                border-radius: 4px;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                border: 1px solid #ddd;
            }
        </style>
        
        <!-- 消息提示 -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="search-box">
                <form th:action="@{/admin/permissions}" method="get">
                    <input type="text" name="keyword" placeholder="搜索权限名称、编码或描述..." 
                           th:value="${keyword}" />
                    <button type="submit" class="btn btn-primary">🔍 搜索</button>
                    <a th:href="@{/admin/permissions}" class="btn btn-info">重置</a>
                </form>
            </div>
            <div>
                <a th:href="@{/admin/permissions/new}" class="btn btn-success">➕ 新建权限</a>
                <button onclick="batchDelete()" class="btn btn-danger">🗑️ 批量删除</button>
            </div>
        </div>
        
        <!-- 权限列表表格 -->
        <form id="permissionForm" th:action="@{/admin/permissions/batch-delete}" method="post">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell">
                            <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" />
                        </th>
                        <th>ID</th>
                        <th>权限信息</th>
                        <th>权限编码</th>
                        <th>类型</th>
                        <th>角色数量</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="permission : ${permissions.content}">
                        <td class="checkbox-cell">
                            <input type="checkbox" name="ids" th:value="${permission.id}" class="permission-checkbox" />
                        </td>
                        <td th:text="${permission.id}">1</td>
                        <td>
                            <div class="permission-info">
                                <div class="permission-icon" th:text="${permission.icon != null and !permission.icon.empty ? permission.icon : '🔐'}">🔐</div>
                                <div>
                                    <div><strong th:text="${permission.name}">权限名</strong></div>
                                    <div style="font-size: 12px; color: #666;" th:text="${permission.description ?: '无描述'}">描述</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="code-badge" th:text="${permission.code}">user:view</span>
                        </td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${permission.type == 'MENU' ? 'badge-type-menu' : (permission.type == 'BUTTON' ? 'badge-type-button' : 'badge-type-api')}"
                                  th:text="${permission.type}">MENU</span>
                        </td>
                        <td>
                            <span class="badge" style="background: #ff9800; color: white;" 
                                  th:text="${permission.roles != null ? permission.roles.size() : 0}">0</span>
                        </td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${permission.status} ? 'badge-status-enabled' : 'badge-status-disabled'"
                                  th:text="${permission.status} ? '启用' : '禁用'">启用</span>
                        </td>
                        <td th:text="${#temporals.format(permission.createTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/admin/permissions/{id}(id=${permission.id})}" class="btn btn-info">查看</a>
                                <a th:href="@{/admin/permissions/edit/{id}(id=${permission.id})}" class="btn btn-warning">编辑</a>
                                <button type="button" th:onclick="'toggleStatus(' + ${permission.id} + ')'" 
                                        class="btn" 
                                        th:classappend="${permission.status} ? 'btn-warning' : 'btn-success'"
                                        th:text="${permission.status} ? '禁用' : '启用'">切换</button>
                                <button type="button" th:onclick="'deletePermission(' + ${permission.id} + ')'" 
                                        class="btn btn-danger">删除</button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${permissions.content.empty}">
                        <td colspan="9" style="text-align: center; padding: 40px; color: #999;">
                            暂无权限数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
        
        <!-- 分页 -->
        <div class="pagination" th:if="${permissions.totalPages > 0}">
            <a th:if="${permissions.hasPrevious()}" 
               th:href="@{/admin/permissions(page=${permissions.number - 1}, size=${permissions.size}, keyword=${keyword})}">上一页</a>
            
            <span th:each="i : ${#numbers.sequence(0, permissions.totalPages - 1)}">
                <a th:if="${i != permissions.number}" 
                   th:href="@{/admin/permissions(page=${i}, size=${permissions.size}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
                <span th:if="${i == permissions.number}" class="active" th:text="${i + 1}">1</span>
            </span>
            
            <a th:if="${permissions.hasNext()}" 
               th:href="@{/admin/permissions(page=${permissions.number + 1}, size=${permissions.size}, keyword=${keyword})}">下一页</a>
        </div>
        
        <script>
            function toggleSelectAll() {
                const selectAll = document.getElementById('selectAll');
                const checkboxes = document.querySelectorAll('.permission-checkbox');
                checkboxes.forEach(cb => cb.checked = selectAll.checked);
            }
            
            function batchDelete() {
                const checkboxes = document.querySelectorAll('.permission-checkbox:checked');
                if (checkboxes.length === 0) {
                    alert('请至少选择一个权限');
                    return;
                }
                
                if (confirm('确定要删除选中的 ' + checkboxes.length + ' 个权限吗？')) {
                    document.getElementById('permissionForm').submit();
                }
            }
            
            function toggleStatus(permissionId) {
                if (confirm('确定要切换该权限的状态吗？')) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/admin/permissions/toggle-status/' + permissionId;
                    document.body.appendChild(form);
                    form.submit();
                }
            }
            
            function deletePermission(permissionId) {
                if (confirm('确定要删除该权限吗？此操作不可恢复！')) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/admin/permissions/delete/' + permissionId;
                    document.body.appendChild(form);
                    form.submit();
                }
            }
        </script>
    </div>
</body>
</html>
