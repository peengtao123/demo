<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>权限详情</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .detail-row {
                display: flex;
                padding: 15px 0;
                border-bottom: 1px solid #eee;
            }
            
            .detail-label {
                width: 150px;
                font-weight: bold;
                color: #666;
            }
            
            .detail-value {
                flex: 1;
                color: #333;
            }
            
            .code-badge {
                background: #e3f2fd;
                color: #1976d2;
                padding: 4px 8px;
                border-radius: 4px;
                font-family: monospace;
                font-size: 13px;
            }
            
            .actions {
                margin-top: 30px;
                display: flex;
                gap: 10px;
            }
            
            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-edit {
                background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
                color: white;
            }
            
            .btn-edit:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3);
            }
            
            .btn-back {
                background: #6c757d;
                color: white;
            }
            
            .btn-back:hover {
                background: #5a6268;
            }
        </style>
        
        <div class="detail-row">
            <div class="detail-label">ID:</div>
            <div class="detail-value" th:text="${permission.id}">1</div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">权限名称:</div>
            <div class="detail-value" th:text="${permission.name}">查看用户</div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">权限编码:</div>
            <div class="detail-value">
                <span class="code-badge" th:text="${permission.code}">user:view</span>
            </div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">描述:</div>
            <div class="detail-value" th:text="${permission.description}">查看用户列表和详情</div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">权限类型:</div>
            <div class="detail-value">
                <span th:if="${permission.type == 'MENU'}" style="background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 4px;">菜单权限</span>
                <span th:if="${permission.type == 'BUTTON'}" style="background: #fff3e0; color: #ef6c00; padding: 4px 8px; border-radius: 4px;">按钮权限</span>
                <span th:if="${permission.type == 'API'}" style="background: #fce4ec; color: #c2185b; padding: 4px 8px; border-radius: 4px;">接口权限</span>
            </div>
        </div>
        
        <div class="detail-row" th:if="${permission.icon != null and permission.icon != ''}">
            <div class="detail-label">图标:</div>
            <div class="detail-value" th:text="${permission.icon}">👥</div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">排序号:</div>
            <div class="detail-value" th:text="${permission.sortOrder}">0</div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">状态:</div>
            <div class="detail-value">
                <span th:if="${permission.status}" style="color: #4caf50; font-weight: bold;">✓ 启用</span>
                <span th:unless="${permission.status}" style="color: #f44336; font-weight: bold;">✗ 禁用</span>
            </div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">创建时间:</div>
            <div class="detail-value" th:text="${#temporals.format(permission.createTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01</div>
        </div>
        
        <div class="detail-row">
            <div class="detail-label">更新时间:</div>
            <div class="detail-value" th:text="${#temporals.format(permission.updateTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01</div>
        </div>
        
        <div class="actions">
            <a th:href="@{/admin/permissions/edit/{id}(id=${permission.id})}" class="btn btn-edit">编辑</a>
            <a href="/admin/permissions" class="btn btn-back">返回列表</a>
        </div>
    </div>
</body>
</html>
