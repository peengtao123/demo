<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>用户管理</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            
            thead {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            
            th, td {
                padding: 15px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            
            tbody tr:hover {
                background: #f9f9f9;
            }
            
            .badge {
                display: inline-block;
                padding: 5px 12px;
                border-radius: 15px;
                font-size: 12px;
                font-weight: bold;
            }
            
            .badge-admin {
                background: #ff9800;
                color: white;
            }
            
            .badge-user {
                background: #4caf50;
                color: white;
            }
            
            .badge-editor {
                background: #2196f3;
                color: white;
            }
            
            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-view {
                background: #2196f3;
                color: white;
            }
            
            .btn-view:hover {
                background: #1976d2;
            }
        </style>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>姓名</th>
                    <th>邮箱</th>
                    <th>电话</th>
                    <th>年龄</th>
                    <th>角色</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}">admin</td>
                    <td th:text="${user.name}">管理员</td>
                    <td th:text="${user.email}">admin@example.com</td>
                    <td th:text="${user.phone}">13800138000</td>
                    <td th:text="${user.age}">30</td>
                    <td>
                        <span class="badge" 
                              th:classappend="${user.role == 'ADMIN'} ? 'badge-admin' : (${user.role == 'EDITOR'} ? 'badge-editor' : 'badge-user')"
                              th:text="${user.role}">USER</span>
                    </td>
                    <td>
                        <a th:href="@{/pages/users/{id}(id=${user.id})}" class="btn btn-view">查看详情</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
