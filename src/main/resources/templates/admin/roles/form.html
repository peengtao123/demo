<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${role.id != null} ? '编辑角色' : '新建角色'">角色表单</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .form-group {
                margin-bottom: 20px;
            }
            
            label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: bold;
            }
            
            input[type="text"],
            textarea {
                width: 100%;
                padding: 12px;
                border: 1px solid #ddd;
                border-radius: 5px;
                font-size: 14px;
                transition: border-color 0.3s;
            }
            
            input[type="text"]:focus,
            textarea:focus {
                outline: none;
                border-color: #667eea;
            }
            
            textarea {
                resize: vertical;
                min-height: 100px;
            }
            
            .form-actions {
                display: flex;
                gap: 10px;
                margin-top: 30px;
            }
            
            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
            }
            
            .btn-secondary {
                background: #6c757d;
                color: white;
            }
            
            .btn-secondary:hover {
                background: #5a6268;
            }
        </style>
        
        <form th:action="@{/admin/roles/save}" th:object="${role}" method="post">
            <input type="hidden" th:field="*{id}" />
            
            <div class="form-group">
                <label for="name">角色名称 *</label>
                <input type="text" id="name" th:field="*{name}" required 
                       placeholder="例如：ADMIN、USER、EDITOR" />
            </div>
            
            <div class="form-group">
                <label for="description">角色描述</label>
                <textarea id="description" th:field="*{description}" 
                          placeholder="请输入角色描述信息"></textarea>
            </div>
            
            <!-- 权限分配 -->
            <div class="form-group">
                <label>🔑 权限分配</label>
                <div style="margin-top: 10px; padding: 15px; background: #f8f9ff; border-radius: 8px; border: 2px solid #e0e0e0;">
                    <!-- 全选按钮 -->
                    <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #667eea;">
                        <label style="display: flex; align-items: center; cursor: pointer; font-weight: bold; color: #667eea;">
                            <input type="checkbox" id="selectAllPermissions" 
                                   style="margin-right: 10px; width: 18px; height: 18px; cursor: pointer;" />
                            <span>全选 / 取消全选</span>
                        </label>
                    </div>
                    
                    <!-- 权限列表 -->
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto;">
                        <div th:each="perm : ${allPermissions}" class="permission-item">
                            <label style="display: flex; align-items: flex-start; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; cursor: pointer; transition: all 0.3s; background: white;"
                                   onmouseover="this.style.borderColor='#667eea'; this.style.background='#f5f7ff'"
                                   onmouseout="this.style.borderColor='#e0e0e0'; this.style.background='white'">
                                <input type="checkbox" name="permissionIds" th:value="${perm.id}" 
                                       th:checked="${role.permissions != null and role.permissions.contains(perm)}"
                                       class="permission-checkbox"
                                       style="margin-right: 10px; margin-top: 3px; width: 16px; height: 16px; cursor: pointer; flex-shrink: 0;" />
                                <div style="flex: 1;">
                                    <div style="font-weight: 500; color: #333; margin-bottom: 3px;">
                                        <i th:class="${perm.icon}" style="margin-right: 5px; color: #667eea;"></i>
                                        <span th:text="${perm.name}">权限名称</span>
                                    </div>
                                    <div style="font-size: 12px; color: #666;">
                                        <code style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-family: monospace;" 
                                              th:text="${perm.code}">permission:code</code>
                                    </div>
                                    <div th:if="${perm.description}" style="font-size: 11px; color: #999; margin-top: 3px;" 
                                         th:text="${perm.description}">权限描述</div>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e0e0e0; font-size: 12px; color: #666;">
                        💡 提示：勾选的权限将分配给该角色，用户拥有该角色后将获得相应权限
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 保存角色</button>
                <a href="/admin/roles" class="btn btn-secondary">← 返回列表</a>
            </div>
        </form>
        
        <script>
            // 全选/取消全选功能
            document.addEventListener('DOMContentLoaded', function() {
                const selectAllCheckbox = document.getElementById('selectAllPermissions');
                const permissionCheckboxes = document.querySelectorAll('.permission-checkbox');
                
                if (selectAllCheckbox) {
                    // 全选按钮点击事件
                    selectAllCheckbox.addEventListener('change', function() {
                        const isChecked = this.checked;
                        permissionCheckboxes.forEach(function(checkbox) {
                            checkbox.checked = isChecked;
                        });
                    });
                    
                    // 监听单个复选框的变化，更新全选按钮状态
                    permissionCheckboxes.forEach(function(checkbox) {
                        checkbox.addEventListener('change', function() {
                            const allChecked = Array.from(permissionCheckboxes).every(cb => cb.checked);
                            const someChecked = Array.from(permissionCheckboxes).some(cb => cb.checked);
                            
                            selectAllCheckbox.checked = allChecked;
                            selectAllCheckbox.indeterminate = !allChecked && someChecked;
                        });
                    });
                    
                    // 初始化全选按钮状态
                    const allChecked = Array.from(permissionCheckboxes).every(cb => cb.checked);
                    const someChecked = Array.from(permissionCheckboxes).some(cb => cb.checked);
                    selectAllCheckbox.checked = allChecked;
                    selectAllCheckbox.indeterminate = !allChecked && someChecked;
                }
            });
        </script>
    </div>
</body>
</html>
