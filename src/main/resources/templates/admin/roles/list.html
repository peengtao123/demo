<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>角色管理</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .actions {
                margin-bottom: 20px;
            }
            
            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
                margin-right: 10px;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
            }
            
            .btn-view {
                background: #2196f3;
                color: white;
            }
            
            .btn-view:hover {
                background: #1976d2;
            }
            
            .btn-edit {
                background: #ff9800;
                color: white;
            }
            
            .btn-edit:hover {
                background: #f57c00;
            }
            
            .btn-delete {
                background: #f44336;
                color: white;
            }
            
            .btn-delete:hover {
                background: #d32f2f;
            }
            
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            
            thead {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            
            th, td {
                padding: 15px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            
            tbody tr:hover {
                background: #f9f9f9;
            }
            
            .alert {
                padding: 15px;
                margin-bottom: 20px;
                border-radius: 5px;
            }
            
            .alert-success {
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }
            
            .alert-error {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }
        </style>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="actions">
            <a href="/admin/roles/new" class="btn btn-primary">+ 新建角色</a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>角色名称</th>
                    <th>描述</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="role : ${roles}">
                    <td th:text="${role.id}">1</td>
                    <td th:text="${role.name}">ADMIN</td>
                    <td th:text="${role.description}">系统管理员</td>
                    <td th:text="${#temporals.format(role.createTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01</td>
                    <td>
                        <a th:href="@{/admin/roles/{id}(id=${role.id})}" class="btn btn-view">查看</a>
                        <a th:href="@{/admin/roles/edit/{id}(id=${role.id})}" class="btn btn-edit">编辑</a>
                        <form th:action="@{/admin/roles/delete/{id}(id=${role.id})}" method="post" style="display:inline;" 
                              onsubmit="return confirm('确定要删除这个角色吗？');">
                            <button type="submit" class="btn btn-delete">删除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
