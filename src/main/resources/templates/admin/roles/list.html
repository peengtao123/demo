<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>角色管理</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .search-box {
                display: flex;
                gap: 10px;
                flex: 1;
                max-width: 500px;
            }
            
            .search-box input {
                flex: 1;
                padding: 10px 15px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .search-box input:focus {
                outline: none;
                border-color: #ff9800;
                box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
            }
            
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                background: white;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }
            
            thead {
                background: linear-gradient(135deg, #ff9800 0%, #e68900 100%);
                color: white;
            }
            
            th, td {
                padding: 15px;
                text-align: left;
                border-bottom: 1px solid #eee;
            }
            
            tbody tr:hover {
                background: #fff8e1;
            }
            
            .badge {
                display: inline-block;
                padding: 5px 12px;
                border-radius: 15px;
                font-size: 12px;
                font-weight: bold;
            }
            
            .badge-status-enabled {
                background: #4caf50;
                color: white;
            }
            
            .badge-status-disabled {
                background: #f44336;
                color: white;
            }
            
            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
                margin-right: 5px;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #ff9800 0%, #e68900 100%);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
            }
            
            .btn-success {
                background: #4caf50;
                color: white;
            }
            
            .btn-success:hover {
                background: #45a049;
            }
            
            .btn-danger {
                background: #f44336;
                color: white;
            }
            
            .btn-danger:hover {
                background: #da190b;
            }
            
            .btn-warning {
                background: #ff9800;
                color: white;
            }
            
            .btn-warning:hover {
                background: #e68900;
            }
            
            .btn-info {
                background: #2196f3;
                color: white;
            }
            
            .btn-info:hover {
                background: #1976d2;
            }
            
            .pagination {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 20px;
                gap: 10px;
            }
            
            .pagination a, .pagination span {
                padding: 8px 16px;
                border: 2px solid #e0e0e0;
                border-radius: 5px;
                text-decoration: none;
                color: #333;
                transition: all 0.3s;
            }
            
            .pagination a:hover {
                background: #ff9800;
                color: white;
                border-color: #ff9800;
            }
            
            .pagination .active {
                background: #ff9800;
                color: white;
                border-color: #ff9800;
            }
            
            .checkbox-cell {
                width: 40px;
            }
            
            .role-icon {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                background: linear-gradient(135deg, #ff9800 0%, #e68900 100%);
                color: white;
            }
            
            .role-info {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .action-buttons {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
            }
            
            .alert {
                padding: 12px 20px;
                margin-bottom: 20px;
                border-radius: 8px;
                border-left: 4px solid;
            }
            
            .alert-success {
                background: #d4edda;
                border-color: #28a745;
                color: #155724;
            }
            
            .alert-error {
                background: #f8d7da;
                border-color: #dc3545;
                color: #721c24;
            }
            
            .permission-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }
            
            .permission-tag {
                background: #e3f2fd;
                color: #1976d2;
                padding: 3px 8px;
                border-radius: 12px;
                font-size: 11px;
            }
        </style>
        
        <!-- 消息提示 -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="search-box">
                <form th:action="@{/admin/roles}" method="get">
                    <input type="text" name="keyword" placeholder="搜索角色名称或描述..." 
                           th:value="${keyword}" />
                    <button type="submit" class="btn btn-primary">🔍 搜索</button>
                    <a th:href="@{/admin/roles}" class="btn btn-info">重置</a>
                </form>
            </div>
            <div>
                <a th:href="@{/admin/roles/new}" class="btn btn-success">➕ 新建角色</a>
                <button onclick="batchDelete()" class="btn btn-danger">🗑️ 批量删除</button>
            </div>
        </div>
        
        <!-- 角色列表表格 -->
        <form id="roleForm" th:action="@{/admin/roles/batch-delete}" method="post">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell">
                            <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" />
                        </th>
                        <th>ID</th>
                        <th>角色信息</th>
                        <th>描述</th>
                        <th>权限数量</th>
                        <th>用户数量</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="role : ${roles.content}">
                        <td class="checkbox-cell">
                            <input type="checkbox" name="ids" th:value="${role.id}" class="role-checkbox" />
                        </td>
                        <td th:text="${role.id}">1</td>
                        <td>
                            <div class="role-info">
                                <div class="role-icon" th:text="${role.icon != null and !role.icon.empty ? role.icon : '🎭'}">🎭</div>
                                <div>
                                    <div><strong th:text="${role.name}">角色名</strong></div>
                                    <div style="font-size: 12px; color: #666;">排序: <span th:text="${role.sortOrder}">0</span></div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${role.description ?: '-'}">-</td>
                        <td>
                            <span class="badge" style="background: #2196f3; color: white;" 
                                  th:text="${role.permissions != null ? role.permissions.size() : 0}">0</span>
                        </td>
                        <td>
                            <span class="badge" style="background: #4caf50; color: white;" 
                                  th:text="${role.users != null ? role.users.size() : 0}">0</span>
                        </td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${role.status} ? 'badge-status-enabled' : 'badge-status-disabled'"
                                  th:text="${role.status} ? '启用' : '禁用'">启用</span>
                        </td>
                        <td th:text="${#temporals.format(role.createTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/admin/roles/{id}(id=${role.id})}" class="btn btn-info">查看</a>
                                <a th:href="@{/admin/roles/edit/{id}(id=${role.id})}" class="btn btn-warning">编辑</a>
                                <button type="button" th:onclick="'toggleStatus(' + ${role.id} + ')'" 
                                        class="btn" 
                                        th:classappend="${role.status} ? 'btn-warning' : 'btn-success'"
                                        th:text="${role.status} ? '禁用' : '启用'">切换</button>
                                <button type="button" th:onclick="'deleteRole(' + ${role.id} + ')'" 
                                        class="btn btn-danger">删除</button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${roles.content.empty}">
                        <td colspan="9" style="text-align: center; padding: 40px; color: #999;">
                            暂无角色数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
        
        <!-- 分页 -->
        <div class="pagination" th:if="${roles.totalPages > 0}">
            <a th:if="${roles.hasPrevious()}" 
               th:href="@{/admin/roles(page=${roles.number - 1}, size=${roles.size}, keyword=${keyword})}">上一页</a>
            
            <span th:each="i : ${#numbers.sequence(0, roles.totalPages - 1)}">
                <a th:if="${i != roles.number}" 
                   th:href="@{/admin/roles(page=${i}, size=${roles.size}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
                <span th:if="${i == roles.number}" class="active" th:text="${i + 1}">1</span>
            </span>
            
            <a th:if="${roles.hasNext()}" 
               th:href="@{/admin/roles(page=${roles.number + 1}, size=${roles.size}, keyword=${keyword})}">下一页</a>
        </div>
        
        <script>
            function toggleSelectAll() {
                const selectAll = document.getElementById('selectAll');
                const checkboxes = document.querySelectorAll('.role-checkbox');
                checkboxes.forEach(cb => cb.checked = selectAll.checked);
            }
            
            function batchDelete() {
                const checkboxes = document.querySelectorAll('.role-checkbox:checked');
                if (checkboxes.length === 0) {
                    alert('请至少选择一个角色');
                    return;
                }
                
                if (confirm('确定要删除选中的 ' + checkboxes.length + ' 个角色吗？')) {
                    document.getElementById('roleForm').submit();
                }
            }
            
            function toggleStatus(roleId) {
                if (confirm('确定要切换该角色的状态吗？')) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/admin/roles/toggle-status/' + roleId;
                    document.body.appendChild(form);
                    form.submit();
                }
            }
            
            function deleteRole(roleId) {
                if (confirm('确定要删除该角色吗？此操作不可恢复！')) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/admin/roles/delete/' + roleId;
                    document.body.appendChild(form);
                    form.submit();
                }
            }
        </script>
    </div>
</body>
</html>
