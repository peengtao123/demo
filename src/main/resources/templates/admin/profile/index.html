<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>个人信息</title>
</head>
<body>
    <div th:fragment="content">
        <style>
            .profile-container {
                max-width: 800px;
                margin: 0 auto;
            }
            
            .profile-card {
                background: white;
                border-radius: 12px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                padding: 30px;
                margin-bottom: 20px;
            }
            
            .profile-header {
                display: flex;
                align-items: center;
                gap: 20px;
                margin-bottom: 30px;
                padding-bottom: 20px;
                border-bottom: 2px solid #f0f0f0;
            }
            
            .avatar-large {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 40px;
                color: white;
                overflow: hidden;
            }
            
            .avatar-large img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            
            .profile-info h2 {
                margin: 0 0 5px 0;
                color: #333;
                font-size: 24px;
            }
            
            .profile-info p {
                margin: 0;
                color: #666;
                font-size: 14px;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: bold;
                font-size: 14px;
            }
            
            input[type="text"],
            input[type="number"],
            textarea {
                width: 100%;
                padding: 12px;
                border: 1px solid #ddd;
                border-radius: 5px;
                font-size: 14px;
                transition: border-color 0.3s;
            }
            
            input[type="text"]:focus,
            input[type="number"]:focus,
            textarea:focus {
                outline: none;
                border-color: #667eea;
            }
            
            textarea {
                resize: vertical;
                min-height: 100px;
            }
            
            .help-text {
                font-size: 12px;
                color: #666;
                margin-top: 5px;
            }
            
            .form-actions {
                display: flex;
                gap: 10px;
                margin-top: 30px;
            }
            
            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                font-size: 14px;
                transition: all 0.3s;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
            }
            
            .btn-secondary {
                background: #6c757d;
                color: white;
            }
            
            .btn-secondary:hover {
                background: #5a6268;
            }
            
            .alert {
                padding: 12px 20px;
                margin-bottom: 20px;
                border-radius: 8px;
                border-left: 4px solid;
            }
            
            .alert-success {
                background: #d4edda;
                border-color: #28a745;
                color: #155724;
            }
            
            .alert-error {
                background: #f8d7da;
                border-color: #dc3545;
                color: #721c24;
            }
            
            .info-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        </style>
        
        <!-- 消息提示 -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar-large">
                        <img th:if="${user.avatar != null and user.avatar != ''}" th:src="${user.avatar}" alt="头像" />
                        <span th:unless="${user.avatar != null and user.avatar != ''}" th:text="${user.name != null and user.name.length() > 0 ? user.name.substring(0,1) : 'U'}">U</span>
                    </div>
                    <div class="profile-info">
                        <h2 th:text="${user.name}">用户名</h2>
                        <p>用户名: <span th:text="${user.username}">username</span></p>
                        <p>注册时间: <span th:text="${#temporals.format(user.createTime, 'yyyy-MM-dd')}">2024-01-01</span></p>
                    </div>
                </div>
                
                <form th:action="@{/admin/profile/update}" method="post">
                    <div class="info-row">
                        <div class="form-group">
                            <label for="name">姓名 *</label>
                            <input type="text" id="name" name="name" th:value="${user.name}" required 
                                   placeholder="请输入姓名" />
                        </div>
                        
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="text" id="email" th:value="${user.email}" disabled 
                                   style="background: #f5f5f5; cursor: not-allowed;" />
                            <div class="help-text">邮箱不可修改，如需修改请联系管理员</div>
                        </div>
                    </div>
                    
                    <div class="info-row">
                        <div class="form-group">
                            <label for="phone">电话</label>
                            <input type="text" id="phone" name="phone" th:value="${user.phone}" 
                                   placeholder="请输入电话号码" />
                        </div>
                        
                        <div class="form-group">
                            <label for="age">年龄</label>
                            <input type="number" id="age" name="age" th:value="${user.age}" 
                                   placeholder="请输入年龄" min="1" max="150" />
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="avatar">头像URL</label>
                        <input type="text" id="avatar" name="avatar" th:value="${user.avatar}" 
                               placeholder="请输入头像URL地址" />
                        <div class="help-text">支持图片URL，建议使用正方形图片</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="remark">备注</label>
                        <textarea id="remark" name="remark" 
                                  placeholder="请输入个人备注信息" th:text="${user.remark}"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存修改</button>
                        <a href="/admin/profile/password" class="btn btn-secondary">修改密码</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
