<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .user-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
        }
        .detail-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .detail-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .detail-value {
            color: #333;
            font-size: 1.1em;
        }
        .actions {
            margin-top: 30px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/pages/users" class="back-link">← 返回用户列表</a>
        
        <h1>👤 用户详情</h1>

        <div class="user-avatar" th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">U</div>

        <div class="detail-item">
            <div class="detail-label">用户ID</div>
            <div class="detail-value" th:text="${user.id}">1</div>
        </div>

        <div class="detail-item">
            <div class="detail-label">姓名</div>
            <div class="detail-value" th:text="${user.name}">张三</div>
        </div>

        <div class="detail-item">
            <div class="detail-label">用户名</div>
            <div class="detail-value" th:text="${user.username}">zhangsan</div>
        </div>

        <div class="detail-item">
            <div class="detail-label">邮箱</div>
            <div class="detail-value" th:text="${user.email}">zhangsan@example.com</div>
        </div>

        <div class="detail-item">
            <div class="detail-label">年龄</div>
            <div class="detail-value" th:text="${user.age}">25</div>
        </div>

        <div class="detail-item">
            <div class="detail-label">创建时间</div>
            <div class="detail-value" th:text="${#temporals.format(user.createTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01 12:00:00</div>
        </div>

        <div class="detail-item">
            <div class="detail-label">更新时间</div>
            <div class="detail-value" th:text="${#temporals.format(user.updateTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01 12:00:00</div>
        </div>

        <div class="actions">
            <a href="/pages/users" class="btn">返回列表</a>
            <a th:href="@{/api/users/{id}(id=${user.id})}" class="btn">查看API</a>
        </div>
    </div>
</body>
</html>
